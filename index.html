<style>
:root{
  color-scheme:dark;
  --bg:#060608;
  --ink:#ECEBF2;
  --muted:#8C8B98;

html,body{height:100%}

.handle{position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%)}

.handle.aim{width:20px;height:20px;border:1px dashed rgba(255,255,255,.35)}
.handle.aim::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:rgba(255,255,255,.5)}
body.light-scene .handle.src{border-color:rgba(0,0,0,.45)}
body.light-scene .handle.aim{border-color:rgba(0,0,0,.35)}
body.light-scene .handle.aim::after{background:rgba(0,0,0,.45)}

.panel{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(292px,calc(100vw - 32px));max-height:calc(100% - 90px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);overflow:hidden}
.panel::before{content:"";display:block;height:2px;background:var(--spectrum);opacity:.85;flex:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px 14px;flex:none}
.panel-head h2{margin:0;font:500 10.5px/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.collapse{background:none;border:0;color:var(--muted);font:500 10.5px/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:4px 2px}

.group{display:flex;flex-direction:column;gap:7px}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 12px/1 "Geist",system-ui,sans-serif;padding:7px 10px;border-radius:999px;cursor:pointer}

.sheet-body h3{margin:36px 0 10px;font:500 11px/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--sheet-ink) 55%,transparent)}

.sheet-body .copy{appearance:none;border:1px solid color-mix(in srgb,var(--sheet-ink) 22%,transparent);background:transparent;color:inherit;border-radius:999px;padding:8px 14px;font:500 12px/1 "Geist",system-ui,sans-serif;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:#ECEBF2;color:#0B0B0E;font:500 12px/1 "Geist",system-ui,sans-serif;padding:9px 13px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.nogl{position:fixed;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center;color:var(--muted)}

<script>
(() => {
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', {antialias:false, alpha:false, premultipliedAlpha:false});
if (!gl) { document.body.insertAdjacentHTML('beforeend','<div class="nogl">This experiment needs WebGL2, which this browser did not provide.</div>'); return; }
const floatOK = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));

/* ---------- scene (units = Figma px, relative to the cluster centre) ---------- */
const FIGMA_LENSES = [
  {x:-63.5, y:53.5,  r:109.5},
  {x:104.5, y:98.5,  r:64.5},
  {x:89.5,  y:-36.5, r:83.5},
  {x:-12,   y:-100,  r:64},
];
let lenses = FIGMA_LENSES.map(c => ({...c}));
let beams = [];
const S = {
  preset:'grid', weight:.5, bounce:.6, friction:.6, nRefl:.8, inAmt:.12, inAng:90, inDist:.12, inBlur:.25, inTone:0, textColor:'#1c1c1e', labelColor:'#18181b', labelTrack:-.035, rim:.55, rimW:.7, rimDir:1, fill:.01, fillW:.55, shadow:.03, shadowSize:.12, shadowY:.16, catchL:5.7, sat:1.8, dots:.05, dotR:.3, dotSp:4.4, dotBase:.13, dotAng:89, dotTone:1, roll:2.8, idleSpin:.1, alt:true, textSize:20, textWeight:580, textTrack:0, count:10, cScale:1.5, labels:'About, Contacts, Works, Lab', labelSize:.41, labelInk:.97, labelDots:.33, labelWeight:570, labelSettle:.1, labelBack:.8, hovFill:.075, hovRim:.8, labelSizeOpen:.75, pBlur:.73, pFill:.055, pRefl:.37, pFillCol:'#ffffff', pDots:.05, pShadow:.07, pShBlur:36, pShY:40, hideTitle:true, panelPos:'center', openMode:'inplace', frost:.85, sound:true, soundVol:.29, ringAmt:.86, flashAmt:.46,
  grid:5, gridMax:1600, spacing:202, lock:true, soft:.52, parallel:true, gravity:false, collide:true, newSize:123, newVariety:.9,
  theme:'grey', ior:1.1, disp:0.245, refl:1.7, bright:1.7, glow:0,
  lens:0.27, ca:0.06, width:1, orbit:false, handles:false, text:'Vova (9) Deviatkin\nProduct Designer'
};

const THEMES = {
  void:     {bg:[.0030,.0030,.0042], bgAlb:.10, txt:[.026,.026,.030], txtAlb:.9, haze:1.0, surf:1, rim:.35, rimCol:[.8,.83,.95], shadow:0,   light:false},
  graphite: {bg:[.017,.017,.021],   bgAlb:.22, txt:[.16,.16,.17],    txtAlb:.9, haze:.85, surf:1, rim:.35, rimCol:[1,1,1],       shadow:.35, light:false},
  grey:     {bg:[.60,.60,.60],      bgAlb:.45, txt:[.012,.012,.013], txtAlb:.1, haze:.5,  surf:1, rim:.9,  rimCol:[1,1,1],       shadow:.07, light:true},
};

/* ---------- layout ---------- */
let W=0, H=0, dpr=1, DW=0, DH=0, sc=1;
const toScreen = (x,y) => [W/2 + x*sc, H/2 + y*sc];
const toScene  = (x,y) => [(x - W/2)/sc, (y - H/2)/sc];
const halfW = () => W/2/sc, halfH = () => H/2/sc;

/* ---------- spectrum ---------- */
function xyz(l){
  const g=(x,m,a,b)=>{const t=(x-m)/(x<m?a:b);return Math.exp(-.5*t*t)};
  return [1.056*g(l,599.8,37.9,31.0)+.362*g(l,442.0,16.0,26.7)-.065*g(l,501.1,20.4,26.2),
          .821*g(l,568.8,46.9,40.5)+.286*g(l,530.9,16.3,31.1),
          1.217*g(l,437.0,11.8,36.0)+.681*g(l,459.0,26.0,13.8)];
}
const SPEC = new Float32Array(301*3); // 400..700nm, white-balanced so the mean is (1,1,1)
(() => {
  const sum=[0,0,0];
  for (let i=0;i<=300;i++){
    const [X,Y,Z]=xyz(400+i);
    const c=[3.2406*X-1.5372*Y-.4986*Z, -.9689*X+1.8758*Y+.0415*Z, .0557*X-.2040*Y+1.0570*Z].map(v=>Math.max(0,v));
    for (let k=0;k<3;k++){SPEC[i*3+k]=c[k];sum[k]+=c[k];}
  }
  for (let i=0;i<=300;i++) for (let k=0;k<3;k++) SPEC[i*3+k]*=301/sum[k];
})();
function specAt(l){const i=Math.min(300,Math.max(0,Math.round(l-400)))*3;return [SPEC[i],SPEC[i+1],SPEC[i+2]];}
function laserRGB(l){const c=specAt(l);const m=Math.max(...c);return c.map(v=>v/m);}
const iorAt = l => S.ior + S.disp*((550/l)**2 - 1);
function abbe(){
  const n=l=>S.ior+S.disp*((550/l)**2-1);
  const d=n(486.1)-n(656.3);
  return d<=1e-6 ? '∞' : Math.round((n(587.6)-1)/d);
}

/* ---------- presets ---------- */
function beamAt(angDeg, ax, ay, w, p, lam=null){
  const a=angDeg*Math.PI/180;
  return {sx:Math.cos(a)*halfW()*.8, sy:Math.sin(a)*halfH()*.8, ax, ay, w, p, lam};
}
const STUDIO_LENSES = [
  {x:146.49, y:39.44,  r:109.5},
  {x:9.06,   y:114.84, r:64.5},
  {x:-54.05, y:-41.83, r:83.5},
  {x:44.23,  y:-80.25, r:64},
];
// Parallel beams across the screen. n beams split min(window width, S.gridMax) into n+1 equal columns, centred,
// so 5 beams make a 6-column grid edge to edge. Lamps sit just beyond the screen edge, so only beams show.
// gridMeta holds the beam direction; with S.alt every second beam comes from the opposite edge.
let gridMeta={cx:0,cy:0,dx:0,dy:-1};
function gridBeams(n,keep){
  if(!keep)gridMeta={cx:0,cy:0,dx:0,dy:-1};
  const {dx,dy}=gridMeta,px=-dy,py=dx,w=S.width||1;
  const span=Math.min(W,S.gridMax)/sc,step=span/(n+1);
  const ext=Math.abs(dx)*halfW()+Math.abs(dy)*halfH()+60/sc; // distance from the centre to just past the screen edge
  return Array.from({length:n},(_,i)=>{
    const o=(i+1)*step-span/2,bx=px*o,by=py*o,flip=S.alt&&i%2===1,k=flip?-1:1;
    const sx=bx-dx*ext*k,sy=by-dy*ext*k;
    return {sx,sy,ax:sx+dx*400*k,ay:sy+dy*400*k,w,p:1,lam:null,flip};
  });
}
/* Per-background look: text colour, circle border/fill/shadow and dots are kept separately for each
   background, so switching between grey and void swaps in the settings that work on it. */
const THEME_KEYS=['textColor','labelColor','nRefl','inAmt','inAng','inDist','inBlur','inTone','rim','rimW','rimDir','fill','fillW','shadow','shadowSize','shadowY','catchL','dots','dotR','dotSp','dotBase','dotAng','dotTone'];
const THEME_STYLE={
  grey:    {textColor:'#1c1c1e',labelColor:'#18181b',nRefl:1.03,inAmt:0,inAng:90,inDist:.04,inBlur:.19,inTone:1,rim:.51,rimW:.5,rimDir:1,fill:0,fillW:.02,shadow:.03,shadowSize:.12,shadowY:.16,catchL:5.7,dots:.05,dotR:.3,dotSp:4.4,dotBase:.13,dotAng:89,dotTone:1},
  void:    {textColor:'#a4a3ad',labelColor:'#a4a3ad',nRefl:.8,inAmt:.12,inAng:90,inDist:.12,inBlur:.25,inTone:1,rim:.45,rimW:.7,rimDir:1,fill:.02,fillW:.55,shadow:0,  shadowSize:.14,shadowY:.28,catchL:5.7,dots:.05,dotR:.3,dotSp:4.4,dotBase:.13,dotAng:89,dotTone:1},
  graphite:{textColor:'#c8c7cf',labelColor:'#c8c7cf',nRefl:.8,inAmt:.12,inAng:90,inDist:.12,inBlur:.25,inTone:0,rim:.5, rimW:.7,rimDir:1,fill:.02,fillW:.55,shadow:.2, shadowSize:.14,shadowY:.28,catchL:5.7,dots:.05,dotR:.3,dotSp:4.4,dotBase:.13,dotAng:89,dotTone:1},
};
S.per=JSON.parse(JSON.stringify(THEME_STYLE));
const hexLin=h=>[1,3,5].map(i=>Math.pow(parseInt(h.slice(i,i+2),16)/255,2.2));
const PRESETS = {
  // Saved setup: five parallel beams rising from the bottom, seven lenses spread across the page

/* ---------- ray tracing (2D, CPU) ---------- */
let verts=new Float32Array(1<<19), nv=0;

  verts[nv++]=x0;verts[nv++]=y0;verts[nv++]=r;verts[nv++]=g;verts[nv++]=b;

function trace(){
  nv=0;

  const inside=(x,y)=>{for(const c of C){const dx=x-c[0],dy=y-c[1];if(dx*dx+dy*dy<c[2]*c[2])return true;}return false;};
  const FAR=5000, GLASS=1.6, stack=[];

    const [sx,sy]=toScreen(bm.sx,bm.sy),[ax,ay]=toScreen(bm.ax,bm.ay);
    let bx=ax-sx,by=ay-sy;const bl=Math.hypot(bx,by)||1;bx/=bl;by/=bl;
    const px=-by,py=bx, wpx=Math.max(.5,bm.w*sc);

    const nr=Math.round(Math.min(mono?400:170,Math.max(mono?24:10,wpx*(mono?3:.7))));
    const base=bm.p*S.bright*wpx*dpr/(nr*NL);

      for(let i=0;i<nr;i++){
        const lam=mono?bm.lam:400+(j+Math.random())*300/NL;
        const col=mono?laserRGB(lam):specAt(lam);
        const n=mono?S.ior:iorAt(lam);
        const u=(i+Math.random())/nr-.5;
        const prof=1-smooth(.3,.5,Math.abs(u));

              if(disc<=0)continue;const s=Math.sqrt(disc);let t=-b-s;if(t<1e-3)t=-b+s;

      moved+=corr;
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){if(fresh){impact(a,nx,ny,-vn,true);impact(b,-nx,-ny,-vn,false);}
        const e=!fresh||-vn<REST?0:PHYS.eHit; // resting contact: just stop approaching
        const jj=-(1+e)*vn/(ia+ib)*(ia&&ib?1:heft());a.vx-=jj*ia*nx;a.vy-=jj*ia*ny;b.vx+=jj*ib*nx;b.vy+=jj*ib*ny;}
    }
    touching=now;
  }
  let vmax=0;for(const l of lenses)if(!held(l))vmax=Math.max(vmax,Math.hypot(l.vx,l.vy));
  if(!S.gravity&&vmax<4&&moved<.05){for(const l of lenses){l.vx=0;l.vy=0;}return false;}
  return vmax>=4||moved>=.05;

function newRadius(){return Math.max(8,S.newSize*S.cScale*(1+S.newVariety*(Math.random()*2-1)*.85));}
// Add circles at the emptiest of a few random spots, or remove the most recent ones, until there are n.
function setCount(n){
  while(lenses.length>n)lenses.pop();
  while(lenses.length<n){
    const r=newRadius(),hw=Math.max(1,halfW()-r),hh=Math.max(1,halfH()-r);let best=null,bo=Infinity;
    for(let k=0;k<24;k++){
      const x=(Math.random()*2-1)*hw,y=(Math.random()*2-1)*hh;
      const o=lenses.reduce((a,l)=>a+Math.max(0,l.r+r-Math.hypot(l.x-x,l.y-y)),0);
      if(o<bo){bo=o;best={x,y};}
    }
    lenses.push({x:best.x,y:best.y,r,vx:0,vy:0});
  }

/* Each ball keeps an orientation (row-major 3x3, ball -> world). Rolling: the front of the ball moves with the
   circle's velocity, so the angular velocity is (-vy, vx, 0)/r; idle spin adds a slow turn about a per-ball axis. */
function randomAxis(){const z=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-z*z);return [s*Math.cos(a),s*Math.sin(a),z];}
function rotMat(k,t){const [x,y,z]=k,c=Math.cos(t),s=Math.sin(t),C=1-c;
  return [c+x*x*C,x*y*C-z*s,x*z*C+y*s, y*x*C+z*s,c+y*y*C,y*z*C-x*s, z*x*C-y*s,z*y*C+x*s,c+z*z*C];}
function mul3(a,b){const o=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)o[i*3+j]=a[i*3]*b[j]+a[i*3+1]*b[3+j]+a[i*3+2]*b[6+j];return o;}
function orthonormal(m){
  let a=[m[0],m[3],m[6]],b=[m[1],m[4],m[7]];
  const n=v=>{const l=Math.hypot(...v);return v.map(x=>x/l);};a=n(a);
  const d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];b=n([b[0]-d*a[0],b[1]-d*a[1],b[2]-d*a[2]]);
  const c=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  return [a[0],b[0],c[0],a[1],b[1],c[1],a[2],b[2],c[2]];
}
// Turn a ball part of the way back to its home orientation (label facing the viewer, upright).
function settle(l,dt){
  const m=l.m,D=[m[0],m[3],m[6],m[1],m[4],m[7],m[2],m[5],m[8]];
  const ang=Math.acos(Math.min(1,Math.max(-1,(D[0]+D[4]+D[8]-1)/2)));
  if(ang<.002)return false;
  let ax=[D[7]-D[5],D[2]-D[6],D[3]-D[1]];const sn=Math.hypot(...ax);
  ax=sn<1e-6?[0,1,0]:ax.map(v=>v/sn);
  l.m=orthonormal(mul3(rotMat(ax,ang*(1-Math.exp(-S.labelSettle*3*dt))),l.m));
  return true;
}
function spin(dt){
  let any=false;const stale=performance.now()-pv.t>60;
  for(const l of lenses){
    if(!l.m)l.m=rotMat(randomAxis(),Math.random()*6.28);
    if(!l.ax)l.ax=randomAxis();
    const still=held(l)&&stale,vx=still?0:l.vx||0,vy=still?0:l.vy||0;
    const idle=l.label!=null?0:S.idleSpin;
    const w=[-vy/l.r*S.roll+l.ax[0]*idle, vx/l.r*S.roll+l.ax[1]*idle, l.ax[2]*idle];
    const wl=Math.hypot(...w);
    if(wl*dt>=1e-7){l.m=orthonormal(mul3(rotMat(w.map(v=>v/wl),wl*dt),l.m));any=true;}
    if(l.label!=null&&S.labelSettle>0&&!(held(l)&&!stale)&&Math.hypot(vx,vy)<60&&settle(l,dt))any=true;
  }
  return any;
}

}

  const data={physics:{weight:S.weight,bounciness:S.bounce,friction:S.friction},impacts:{rimGlint:S.flashAmt,dotSparkle:S.ringAmt,sound:S.sound,soundVolume:S.soundVol},menuLabels:{labels:S.labels,size:S.labelSize,weight:S.labelWeight,letterSpacing:S.labelTrack,colour:S.labelColor,printedInk:S.labelInk,dottedLetters:S.labelDots,faceFront:S.labelSettle,seenThroughGlass:S.labelBack,hoverFill:S.hovFill,hoverBorder:S.hovRim,sizeWhenOpen:S.labelSizeOpen,panelBlur:S.pBlur,panelFill:S.pFill,panelColour:S.pFillCol,panelDots:S.pDots,hideTitleWhenOpen:S.hideTitle,panelPosition:S.panelPos,panelShadow:{amount:S.pShadow,blur:S.pShBlur,offsetY:S.pShY},panelReflections:S.pRefl,openMode:S.openMode},perBackground:S.per,textColor:S.textColor,circleCount:lenses.length,circleScale:S.cScale,alternateDirections:S.alt,dots:{roll:S.roll,idleSpin:S.idleSpin,amount:S.dots,size:S.dotR,spacing:S.dotSp,inShadow:S.dotBase,lightAngle:S.dotAng,tone:S.dotTone},newCircles:{size:S.newSize,variety:S.newVariety},circleStyle:{innerShadow:{amount:S.inAmt,angle:S.inAng,distance:S.inDist,blur:S.inBlur,tone:S.inTone},neighbourReflections:S.nRefl,border:S.rim,borderWidth:S.rimW,borderHighlight:S.rimDir,fill:S.fill,fillDepth:S.fillW,shadow:S.shadow,shadowSize:S.shadowSize,shadowOffset:S.shadowY,edgeLightCatch:S.catchL},theme:S.theme,gridBeams:S.parallel?beams.length:null,gridMaxWidth:S.parallel?S.gridMax:null,beamSoftness:S.soft,colourSaturation:S.sat,collide:S.collide,gravity:S.gravity,ior:S.ior,dispersion:S.disp,abbe:abbe(),reflections:S.refl,brightness:S.bright,glow:S.glow,textWarp:S.lens,colourFringe:S.ca,text:S.text,textSize:S.textSize,textWeight:S.textWeight,letterSpacing:S.textTrack,
    units:'Figma px from the lens cluster centre',
    lenses:lenses.map(l=>({x:r(l.x),y:r(l.y),r:r(l.r)})),
    beams:beams.map(b=>({source:[r(b.sx),r(b.sy)],aim:[r(b.ax),r(b.ay)],width:b.w,power:b.p,wavelength:b.lam??'white'}))};
  const txt=JSON.stringify(data,null,2);
  navigator.clipboard.writeText(txt).then(()=>toast('Settings copied'),()=>{toast('Clipboard blocked: settings logged to console');console.log(txt);});
});

/* ---------- resize & loop ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;DW=Math.round(W*dpr);DH=Math.round(H*dpr);
  cv.width=DW;cv.height=DH;
  sc=Math.min(W/620,H/720,2);
  const hw=halfW()-24/sc,hh=halfH()-24/sc;
  if(S.parallel&&beams.length)beams=gridBeams(beams.length,true).map((b,i)=>({...b,w:beams[i]?beams[i].w:b.w})); // grid follows the window
  else beams.forEach(b=>{b.sx=Math.max(-hw,Math.min(hw,b.sx));b.sy=Math.max(-hh,Math.min(hh,b.sy));});
  buildTargets();drawText();placeHandles();markDirty();
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  syncCount();
  const panelMoving=stepPanel(dt);
  const active=physics(dt)||panelMoving;
  if(S.dots>0&&spin(dt))needComposite=true;
  {const now=clock();if(lenses.some(l=>l.imp&&now-l.imp.t<1))needComposite=true;}
  // ease each menu circle's hover amount toward 1 (under the mouse) or 0
  for(const l of lenses){const t=l===hoverLens&&!drag?1:0,h=l.hov||0;if(Math.abs(t-h)>.002){l.hov=h+(t-h)*(1-Math.exp(-dt*14));needComposite=true;}else l.hov=t;}
  const motion=!!drag||S.orbit||active;
  if(S.orbit){
    const a=dt*.25,ca=Math.cos(a),sa=Math.sin(a);
    if(S.parallel){beams.forEach(b=>{[b.sx,b.sy]=[b.sx*ca-b.sy*sa,b.sx*sa+b.sy*ca];[b.ax,b.ay]=[b.ax*ca-b.ay*sa,b.ax*sa+b.ay*ca];});
      const g=gridMeta;[g.cx,g.cy]=[g.cx*ca-g.cy*sa,g.cx*sa+g.cy*ca];[g.dx,g.dy]=[g.dx*ca-g.dy*sa,g.dx*sa+g.dy*ca];}
    else beams.forEach(b=>{const dx=b.sx-b.ax,dy=b.sy-b.ay;b.sx=b.ax+dx*ca-dy*sa;b.sy=b.ay+dx*sa+dy*ca;});
    placeHandles();
  }
  if(wasMotion&&!motion)clearNext=true;
  wasMotion=motion;
  let decay=null;
  if(motion){decay=Wacc===0?0:.45;frames=0;}
  else if(clearNext){decay=0;frames=0;}
  else if(frames<MAXF)decay=1;
  if(decay!==null){accumulate(decay);frames++;clearNext=false;bloom();needComposite=true;}
  if(needComposite){if(sec.lens){composite(T.scene);panelPass();}else composite();needComposite=false;}
}

W=innerWidth;H=innerHeight;sc=Math.min(W/620,H/720,2);
applyPreset('grid');
resize();
panel.classList.add('gone');
// H shows/hides the settings panel (ignored while typing in a field)
addEventListener('keydown',e=>{
  if(e.key!=='h'&&e.key!=='H'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;
  const gone=panel.classList.toggle('gone');if(!gone)setPanel(true);
});
addEventListener('resize',resize);
drawLabels();
if(document.fonts)document.fonts.load('500 20px Geist').then(()=>{drawText();drawLabels();}).catch(()=>{});
requestAnimationFrame(loop);
})();
</script>
